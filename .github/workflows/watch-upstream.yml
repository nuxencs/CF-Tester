name: Watch upstream channels

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.value }}
      guides_commit: ${{ steps.guides.outputs.commit }}

    steps:
      - name: Checkout CF-Tester
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Checkout Guides
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          repository: TRaSH-Guides/Guides
          path: Guides
          persist-credentials: false

      - name: Record Guides commit
        id: guides
        run: |
          guides_commit="$(git -C Guides rev-parse HEAD)"
          echo "commit=$guides_commit" >>"$GITHUB_OUTPUT"
          echo "Guides commit: \`$guides_commit\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Resolve current upstream channels
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/resolve_channels.py \
            --lock channels.lock.json >resolved-channels.json
          echo "value=$(jq -c '{include}' resolved-channels.json)" \
            >>"$GITHUB_OUTPUT"

          {
            echo "### Upstream channel status"
            echo
            echo "| Target | Pinned | Current | Status |"
            echo "| --- | --- | --- | --- |"
            jq -r '.include[] | [
              (.application + "/" + .channel),
              (.pinnedVersion + " (`" + .pinnedCommit[0:12] + "`)"),
              (.version + " (`" + .commit[0:12] + "`)"),
              (if .drift then "Drift" else "Current" end)
            ] | "| " + join(" | ") + " |"' \
              resolved-channels.json
          } >>"$GITHUB_STEP_SUMMARY"

          drift_count="$(jq '[.include[] | select(.drift)] | length' \
            resolved-channels.json)"
          if [[ "$drift_count" -gt 0 ]]; then
            printf '%s%s\n' \
              "::notice title=Upstream channel drift::" \
              "$drift_count pinned target(s) differ from the current upstream release."
          else
            echo "No upstream channel drift found."
          fi

  worker:
    needs: matrix
    name: Current ${{ matrix.application }}/${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}

    steps:
      - name: Checkout CF-Tester
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Checkout Guides
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          repository: TRaSH-Guides/Guides
          ref: ${{ needs.matrix.outputs.guides_commit }}
          path: Guides
          persist-credentials: false

      - name: Checkout ${{ matrix.application }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          repository: ${{ matrix.application == 'radarr' && 'Radarr/Radarr' || 'Sonarr/Sonarr' }}
          ref: ${{ matrix.commit }}
          path: upstream

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: |
            6.0.405
            8.0.421

      - name: Record resolved target
        env:
          TARGET_APPLICATION: ${{ matrix.application }}
          TARGET_CHANNEL: ${{ matrix.channel }}
          TARGET_UPSTREAM_CHANNEL: ${{ matrix.upstreamChannel }}
          TARGET_VERSION: ${{ matrix.version }}
          TARGET_COMMIT: ${{ matrix.commit }}
        run: |
          jq -n \
            --arg application "$TARGET_APPLICATION" \
            --arg channel "$TARGET_CHANNEL" \
            --arg upstreamChannel "$TARGET_UPSTREAM_CHANNEL" \
            --arg version "$TARGET_VERSION" \
            --arg commit "$TARGET_COMMIT" \
            '{
              application: $application,
              channel: $channel,
              upstreamChannel: $upstreamChannel,
              version: $version,
              commit: $commit
            }' \
            >current-target.json

      - name: Test current upstream source
        env:
          GUIDES_DIR: ${{ github.workspace }}/Guides
          RADARR_SOURCE: ${{ github.workspace }}/upstream
          SONARR_SOURCE: ${{ github.workspace }}/upstream
        run: >-
          ./scripts/test-from-source.sh
          "${{ matrix.application }}"
          "${{ matrix.channel }}"
          current-target.json
